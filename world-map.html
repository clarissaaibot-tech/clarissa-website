<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clarissa’s Atlas</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#07090d;
  --glow:#ffd59a;
  --brass:#c9a24a;
  --paper:#fbf9f4;
  --ink:#2c2a33;
  --ink-soft:#6f6a74;
  --veil:#07090d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);overscroll-behavior:none}
body{font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color:#efe6d6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

#desk{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#desk.dragging{cursor:grabbing}

.brand{position:fixed;left:clamp(18px,3.4vw,40px);top:calc(env(safe-area-inset-top,0px) + clamp(14px,2.6vw,30px));
  font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-size:clamp(19px,1.9vw,25px);line-height:1;
  letter-spacing:.01em;z-index:5;pointer-events:none;transition:color 1.2s ease;color:#2c2a33;text-shadow:0 1px 14px rgba(255,255,255,.6)}
body.on-map .brand{color:var(--ink);text-shadow:none}
.brand .b-map{display:none}
body.on-map .brand .b-desk{display:none}
body.on-map .brand .b-map{display:inline}
@media (max-width:760px){body.on-map .brand{font-size:19px;max-width:52vw;line-height:1.08}}

/* hint at the desk */
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + clamp(56px,9vh,84px));transform:translateX(-50%);
  display:flex;align-items:center;gap:14px;z-index:5;transition:opacity .8s ease, transform .8s ease;
  padding:10px 18px 10px 10px;border-radius:999px;background:rgba(255,255,255,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(44,42,51,.08);box-shadow:0 6px 24px rgba(40,40,30,.08)}
.hint svg{flex:none}
.hint p{margin:0;font-size:14px;line-height:1.35;color:#2c2a33}
.hint button{background:none;border:0;padding:0;margin-left:2px;color:#8a6a2c;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.hint button:focus-visible,.back:focus-visible{outline:2px solid var(--glow);outline-offset:4px;border-radius:4px}
.hint.gone{opacity:0;transform:translate(-50%,12px);pointer-events:none}
#ring{transition:stroke-dashoffset .15s linear}

/* paper veil for the transition */
#veil{position:fixed;inset:0;background:var(--paper);opacity:0;pointer-events:none;z-index:3}

/* the map */
#mapwrap{position:fixed;inset:0;z-index:4;visibility:hidden;background:var(--paper)}
#mapwrap.show{visibility:visible}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
.back{position:fixed;right:clamp(18px,3.4vw,40px);top:calc(env(safe-area-inset-top,0px) + clamp(16px,2.8vw,32px));z-index:6;
  background:none;border:0;cursor:pointer;color:var(--ink);font-size:15px;padding:6px 2px;display:flex;align-items:center;gap:8px;
  opacity:0;transition:opacity .8s ease .4s;pointer-events:none}
body.on-map .back{opacity:1;pointer-events:auto}
.back span{border-bottom:1px solid rgba(44,42,51,.35);padding-bottom:2px}
.place{position:fixed;z-index:6;pointer-events:none;font-family:"Instrument Serif",Georgia,serif;font-style:italic;
  font-size:22px;color:var(--ink);white-space:nowrap;transform:translate(-50%,-140%);opacity:0;transition:opacity .25s ease;
  text-shadow:0 0 8px var(--paper),0 0 14px var(--paper)}
.place.on{opacity:1}
.caption{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 52px);transform:translateX(-50%);z-index:6;
  font-size:13px;color:var(--ink-soft);opacity:0;transition:opacity .8s ease .9s;pointer-events:none;white-space:nowrap}
body.on-map .caption{opacity:1}

/* loading */
#loading{position:fixed;inset:0;z-index:10;background:var(--paper);display:grid;place-items:center;transition:opacity 1.4s ease}
#loading p{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:22px;color:#6f6a74;margin:0;opacity:.85}
#loading.done{opacity:0;pointer-events:none}
.fail{max-width:34ch;text-align:center;line-height:1.5}

/* chapters */
.chapters{position:fixed;left:clamp(12px,2.6vw,32px);top:calc(env(safe-area-inset-top,0px) + clamp(78px,8.4vw,104px));z-index:6;
  width:min(262px,40vw);padding:12px 8px 12px;border-radius:16px;background:rgba(251,249,244,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(44,42,51,.06);opacity:0;pointer-events:none;transition:opacity .8s ease .6s;color:var(--ink)}
body.on-map .chapters{opacity:1;pointer-events:auto}
.chHead{margin:0 0 8px 10px;font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.chapters ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.chapters li button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px 1fr;column-gap:8px;width:100%;
  padding:9px 12px 10px 10px;border-radius:12px;transition:background .25s ease}
.chapters li button:hover{background:rgba(181,33,111,.06)}
.chapters li button[aria-current="true"]{background:rgba(181,33,111,.1)}
.chapters li button:focus-visible,.worldBtn:focus-visible,.chapter button:focus-visible{outline:2px solid #b5216f;outline-offset:2px}
.chapters .no{grid-row:span 2;font-family:"Instrument Serif",Georgia,serif;font-size:20px;color:#b5216f;line-height:1.1}
.chapters .nm{font-size:14px;font-weight:500}
.chapters .tt{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:16px;color:var(--ink-soft);line-height:1.2}
.worldBtn{all:unset;cursor:pointer;margin:12px 0 0 10px;font-size:13px;color:var(--ink-soft);border-bottom:1px solid rgba(44,42,51,.25);
  padding-bottom:1px;opacity:0;pointer-events:none;transition:opacity .4s ease}
.worldBtn.show{opacity:1;pointer-events:auto}

.chapter{position:fixed;z-index:7;right:0;top:0;bottom:0;width:min(420px,40vw);background:rgba(251,249,244,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-left:1px solid rgba(44,42,51,.08);
  padding:calc(env(safe-area-inset-top,0px) + 76px) clamp(24px,3vw,44px) calc(env(safe-area-inset-bottom,0px) + 32px);
  overflow-y:auto;transform:translateX(102%);transition:transform .7s cubic-bezier(.2,.7,.2,1);color:var(--ink)}
.chapter.open{transform:none}
.chClose{all:unset;position:absolute;right:20px;top:calc(env(safe-area-inset-top,0px) + 22px);cursor:pointer;color:var(--ink);padding:8px;border-radius:50%}
.chKicker{margin:0;font-size:12px;letter-spacing:.06em;color:#b5216f}
.chPlace{margin:6px 0 0;font-size:14px;color:var(--ink-soft)}
.chapter h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(34px,3.4vw,46px);line-height:1.04;margin:14px 0 22px;text-wrap:balance}
.chBody p{font-size:16px;line-height:1.7;margin:0 0 18px;max-width:34em}
.chBody blockquote{margin:26px 0 8px;padding:0 0 0 18px;border-left:2px solid #b5216f;font-family:"Instrument Serif",Georgia,serif;font-style:italic;
  font-size:23px;line-height:1.35;color:#3c3542;text-wrap:pretty}
.chNav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid rgba(44,42,51,.1)}
.chNav button{all:unset;cursor:pointer;display:grid;gap:2px;font-size:15px;color:var(--ink)}
.chNav button small{font-size:12px;color:var(--ink-soft)}
.chNav button span{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:19px}
.chNav button:disabled{visibility:hidden}
#chNext{text-align:right;margin-left:auto}
body.on-map .back{z-index:8;transition:opacity .8s ease .4s,right .7s cubic-bezier(.2,.7,.2,1)}
@media (min-width:761px){body.ch-open .back{right:calc(min(420px,40vw) + clamp(18px,3.4vw,40px))}}

@media (max-width:760px){
  .chapters{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 46px);left:12px;right:12px;width:auto}
  .chHead{display:none}
  .chapters ol{grid-template-columns:1fr 1fr;gap:8px}
  .chapters li button{background:rgba(251,249,244,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(44,42,51,.08);padding:8px 10px}
  .chapters .tt{font-size:14px}
  .worldBtn{position:absolute;right:4px;top:-30px;margin:0}
  .chapter{top:auto;left:0;width:auto;max-height:62vh;border-left:0;border-top:1px solid rgba(44,42,51,.08);border-radius:20px 20px 0 0;
    padding-top:28px;transform:translateY(102%)}
  .chClose{top:14px}
  .chapter h2{margin:10px 0 16px}
}

@media (prefers-reduced-motion: reduce){
  .chapter{transition:none}
  .hint,.back,.caption,#loading{transition:none}
}

/* ── Site nav — same markup and rules as index.html ── */
#site-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:8;
  padding:14px clamp(18px,3.4vw,40px) calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  pointer-events:none;
  background:linear-gradient(to top,rgba(251,249,244,.92),rgba(251,249,244,0));
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  transition:opacity .6s ease;
}
/* On the map the chapter rail owns the left, so the nav's links step to the
   right and the whole nav fades back until the pointer is near it. */
body.on-map #site-nav .nav-links{opacity:.35;}
body.on-map #site-nav:hover .nav-links{opacity:1;}
#site-nav a, #site-nav button{pointer-events:auto;}
#site-nav .nav-logo{
  font-family:"Instrument Serif",Georgia,"Times New Roman",serif;
  font-size:clamp(20px,2.1vw,26px);font-weight:400;letter-spacing:.01em;
  color:#2c2a33;text-decoration:none;display:flex;align-items:baseline;gap:12px;
  transition:color .6s ease;
}
#site-nav .nav-logo-name{white-space:nowrap;}
#site-nav .ti{position:relative;display:inline-block;line-height:1;}
#site-nav .ti::before{
  content:'';position:absolute;left:0.12em;top:0.0871em;width:0.16em;height:0.14em;
  transform:translateX(-50%);background:currentColor;
  clip-path:polygon(50% 0%,100% 100%,0% 100%);pointer-events:none;
}
#site-nav .nav-tagline{
  font-family:"Manrope",system-ui,sans-serif;font-size:.68rem;font-weight:400;
  letter-spacing:.15em;text-transform:uppercase;color:#b5216f;
}
#site-nav .nav-tagline::before{content:'·';margin-right:12px;color:#6f6a74;}
#site-nav .nav-links{display:flex;gap:34px;list-style:none;margin:0;padding:0;}
#site-nav .nav-links a{
  font-family:"Manrope",system-ui,sans-serif;font-size:.72rem;color:#6f6a74;
  text-decoration:none;letter-spacing:.12em;text-transform:uppercase;transition:color .2s;
}
#site-nav .nav-links a:hover{color:#b5216f;}
#site-nav .nav-links a.on{color:#2c2a33;}
/* The scene behind the nav is light, so the nav reads in ink. On the map it
   is the same. */
body.night #site-nav .nav-logo,body.on-map #site-nav .nav-links a.on{color:#2c2a33;}
@media (max-width:760px){
  #site-nav{padding:14px 18px;}
  #site-nav .nav-tagline{display:none;}
  #site-nav .nav-links{display:none;}
  #site-nav .nav-logo{font-size:20px;}
}

</style>

</button>

'use strict';
/* ---------- small utilities ---------- */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeNoise(seed){
  const r=mulberry(seed), P=new Uint16Array(512), G=new Float32Array(256);
  for(let i=0;i<256;i++){P[i]=i;G[i]=r();}
  for(let i=255;i>0;i--){const j=(r()*(i+1))|0;const t=P[i];P[i]=P[j];P[j]=t;}
  for(let i=0;i<256;i++)P[i+256]=P[i];
  function n(x,y){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const X=xi&255,Y=yi&255;
    const a=G[P[P[X]+Y]],b=G[P[P[X+1]+Y]],c=G[P[P[X]+Y+1]],d=G[P[P[X+1]+Y+1]];
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  }
  function fbm(x,y,o=4){let s=0,amp=.5,f=1,t=0;for(let i=0;i<o;i++){s+=amp*n(x*f,y*f);t+=amp;amp*=.5;f*=2.03;}return s/t;}
  return {n,fbm};
}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}

/* ---------- procedural textures for the desk scene ---------- */
function woodTexture(){
  /* M.wood constructs this at parse time, but M.wood is never used in the
     scene. A quarter size so it costs almost nothing. */
  const w=256,h=128,c=mkCanvas(w,h),g=c.getContext('2d'),id=g.createImageData(w,h),d=id.data,N=makeNoise(7);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const warp=N.fbm(x*.0035,y*.03,4)*7;
    const ring=.5+.5*Math.sin(y*.11+warp*2.2);
    const fig=N.fbm(x*.012,y*.012,3);
    const pore=N.n(x*.9,y*.12);
    let t=clamp(ring*.55+fig*.55-.15,0,1);
    const k=.86+.14*pore;
    const i=(y*w+x)*4;
    d[i]  =lerp(30,78,t)*k;
    d[i+1]=lerp(19,50,t)*k;
    d[i+2]=lerp(12,30,t)*k;
    d[i+3]=255;
  }
  g.putImageData(id,0,0);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
function dotSprite(){
  const s=64,c=mkCanvas(s,s),g=c.getContext('2d'),gr=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.35,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(c);
}
function engravedBandTexture(){
  const w=2048,h=64,c=mkCanvas(w,h),g=c.getContext('2d');
  g.fillStyle='#bbb';g.fillRect(0,0,w,h);
  g.strokeStyle='#333';
  g.lineWidth=2;g.beginPath();g.moveTo(0,8);g.lineTo(w,8);g.moveTo(0,h-8);g.lineTo(w,h-8);g.stroke();
  for(let i=0;i<=360;i++){
    const x=i/360*w,len=i%30===0?h-16:i%10===0?22:i%5===0?16:10;
    g.lineWidth=i%30===0?2.4:1.2;g.beginPath();g.moveTo(x,8);g.lineTo(x,8+len);g.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;return t;
}

function limedOakTexture(){
  /* 512x256 rather than 1024x512: this is a noise texture seen at a
     glancing angle, and the per-pixel fbm loop is linear in area. */
  const w=512,h=256,c=mkCanvas(w,h),g=c.getContext('2d'),id=g.createImageData(w,h),d=id.data,N=makeNoise(21);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const warp=N.fbm(x*.003,y*.025,4)*6;
    const ring=.5+.5*Math.sin(y*.09+warp*2.4);
    const fleck=N.n(x*.35,y*.06);
    const pore=Math.pow(N.n(x*1.1,y*.18),6);            // white-limed open grain
    const tone=.5+.5*N.fbm(x*.008,y*.01,3);
    let r=lerp(222,236,tone)-ring*10-fleck*6, gg=lerp(210,226,tone)-ring*11-fleck*6, b=lerp(190,206,tone)-ring*13-fleck*6;
    r+=pore*30;gg+=pore*30;b+=pore*32;
    const i=(y*w+x)*4;d[i]=r;d[i+1]=gg;d[i+2]=b;d[i+3]=255;
  }
  g.putImageData(id,0,0);
  // plank joints
  g.strokeStyle='rgba(120,100,80,.22)';g.lineWidth=1.2;[h*.25,h*.5,h*.75].forEach(y=>{g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();});
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;
}
function leatherTexture(){
  /* 256 rather than 512 — the pad is small and the grain is noise. */
  const s=256,c=mkCanvas(s,s*.6|0),g=c.getContext('2d'),W=c.width,H=c.height,id=g.createImageData(W,H),d=id.data,N=makeNoise(44);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=.9+.1*N.fbm(x*.03,y*.03,4)-.05*Math.pow(N.n(x*.6,y*.6),3),i=(y*W+x)*4;
    d[i]=196*k;d[i+1]=150*k;d[i+2]=108*k;d[i+3]=255;
  }
  g.putImageData(id,0,0);
  g.setLineDash([5,4]);g.strokeStyle='rgba(250,236,214,.55)';g.lineWidth=1.4;g.strokeRect(9,9,W-18,H-18);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;
  t.repeat.set(1/.64,1/.38);t.offset.set(.5,.5);return t;
}

/* ---------- geography ---------- */
/* The 110m topology is inlined: the armillary globe's texture is built
   synchronously at parse time and needs its land outline, and the hover
   lookup needs the countries. Both are small enough to carry.

   The 50m topology — 756KB of country polygons, by far the biggest thing
   in this page — is fetched in the background. It is only needed when the
   map is painted, which happens after the visitor is already looking at
   the desk. So it arrives in parallel with the scene being built instead
   of blocking the first paint. */
const TOPO110=JSON.parse(document.getElementById('topo110').textContent);
const COUNTRIES110=topojson.feature(TOPO110,TOPO110.objects.countries).features;
const LAND110=topojson.feature(TOPO110,TOPO110.objects.land);

let COUNTRIES50=null;
const landReady=fetch('/atlas-land-50.json').then(function(r){return r.json();})
  .then(function(t){
    COUNTRIES50=topojson.feature(t,t.objects.countries).features;
    return true;
  }).catch(function(){ return false; });

function continentOf(f){
  const n=(f.properties&&f.properties.name)||'';
  if(n==='Antarctica'||n==='Fr. S. Antarctic Lands')return 'an';
  if(n==='Russia')return 'as';
  if(n==='Greenland')return 'na';
  if(n==='Fiji'||n==='New Zealand'||n==='Papua New Guinea'||n==='Solomon Is.'||n==='Vanuatu'||n==='New Caledonia')return 'oc';
  const [lon,lat]=d3.geoCentroid(f);
  if(lat<-60)return 'an';
  if(lon<-25){ return (lat>12||(lat>7&&lon<-77))?'na':'sa'; }
  if(lon>110&&lat<-8)return 'oc';
  if(lon<-150||lon>160)return 'oc';
  if(lon>=-25&&lon<=45&&lat>35)return 'eu';
  if(lon>=-25&&lon<=52&&lat<=35){ if(lon>34&&lat>12)return 'as'; return 'af'; }
  return 'as';
}
const PALETTE={
  na:['#3c86bd','#4fa3c8','#2f6ea8','#6bb3d6','#3f95b0'],
  sa:['#6faa58','#93bf5c','#4f9a62','#a9c96a','#5fae7a'],
  eu:['#d9668a','#e98aa6','#c95479','#f0a3b5','#d9748f'],
  af:['#ee9a43','#f2b55c','#e47f3c','#f5c96d','#e8a04f'],
  as:['#8f62ad','#a979c2','#7a56a6','#c08fcf','#9c6bb8','#e4b94a','#d79a46'],
  oc:['#3fb0a8','#62c3b6','#2f9a99','#82d0c2'],
  an:['#bcd3e2','#cfe0ea']
};
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function hexRgb(h){const v=parseInt(h.slice(1),16);return[(v>>16)&255,(v>>8)&255,v&255];}
function colourFor(f){
  const k=continentOf(f),p=PALETTE[k],h=hashStr(String(f.id||'')+(f.properties.name||''));
  let c=hexRgb(p[h%p.length]);
  // Asia: mostly violets, warm golds in the south and middle east
  if(k==='as'){const [lon,lat]=d3.geoCentroid(f);if(lat<30&&lon<75)c=hexRgb(['#e4b94a','#d79a46','#eac063'][h%3]);else c=hexRgb(['#8f62ad','#a979c2','#7a56a6','#c08fcf','#9c6bb8'][h%5]);}
  const j=((h>>8)%21-10)/100;
  return c.map(v=>clamp(Math.round(v*(1+j)),0,255));
}

/* ---------- watercolour map painter ---------- */
function boxBlur(src,w,h,r){
  // separable box blur, run twice ~ gaussian
  const tmp=new Float32Array(w*h),out=new Float32Array(w*h);
  const pass=(a,b,horiz)=>{
    const len=horiz?w:h,lines=horiz?h:w;
    for(let l=0;l<lines;l++){
      let acc=0;const idx=i=>horiz?l*w+i:i*w+l;
      for(let i=-r;i<=r;i++)acc+=a[idx(clamp(i,0,len-1))];
      for(let i=0;i<len;i++){
        b[idx(i)]=acc/(2*r+1);
        acc+=a[idx(Math.min(i+r+1,len-1))]-a[idx(Math.max(i-r,0))];
      }
    }
  };
  pass(src,tmp,true);pass(tmp,out,false);pass(out,tmp,true);pass(tmp,out,false);
  return out;
}
function sampleGrid(grid,gw,gh,x,y){
  const xi=clamp(Math.floor(x),0,gw-2),yi=clamp(Math.floor(y),0,gh-2),fx=clamp(x-xi,0,1),fy=clamp(y-yi,0,1),i=yi*gw+xi;
  return (grid[i]*(1-fx)+grid[i+1]*fx)*(1-fy)+(grid[i+gw]*(1-fx)+grid[i+gw+1]*fx)*fy;
}

async function paintWatercolourMap(W,H,opt={}){
  const proj=opt.proj||d3.geoNaturalEarth1().fitExtent([[W*.035,H*.05],[W*.965,H*.95]],{type:'Sphere'});
  const N=makeNoise(42),N2=makeNoise(99),rnd=mulberry(1234);

  // 1. flat colour fields, with pigment pooled along borders
  const col=mkCanvas(W,H),g=col.getContext('2d',{willReadFrequently:true}),path=d3.geoPath(proj,g);
  const cols=COUNTRIES50.map(colourFor);  COUNTRIES50.forEach((f,i)=>{g.beginPath();path(f);g.fillStyle=`rgb(${cols[i]})`;g.fill();g.lineWidth=1.6;g.strokeStyle=`rgb(${cols[i]})`;g.stroke();});
  COUNTRIES50.forEach((f,i)=>{const c=cols[i].map(v=>v*.62|0);g.beginPath();path(f);g.lineWidth=2.2;g.strokeStyle=`rgba(${c},.45)`;g.stroke();});
    const src=g.getImageData(0,0,W,H).data;
  // 2. warp so edges wobble like wet paint
  const gs=8,gw=Math.ceil(W/gs)+2,gh=Math.ceil(H/gs)+2,dx=new Float32Array(gw*gh),dy=new Float32Array(gw*gh);
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
    const X=x*gs,Y=y*gs,i=y*gw+x;
    dx[i]=(N.fbm(X/210,Y/210,4)-.5)*22+(N.n(X/38,Y/38)-.5)*6;
    dy[i]=(N.fbm(X/210+50,Y/210+50,4)-.5)*22+(N.n(X/38+9,Y/38+9)-.5)*6;
  }

function frame(){
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;

  if(mode!=='map'){
    // spin physics
    if(!dragging){spin.rotation.y+=spinVel*dt;spinTravel+=Math.abs(spinVel*dt);spinVel*=Math.pow(mode==='desk'?.35:.8,dt);}
    if(mode==='desk'&&!dragging&&Math.abs(spinVel)<.05)spin.rotation.y+=dt*.06; // a slow idle drift
    const prog=clamp(spinTravel/(Math.PI*2*TURNS_TO_OPEN),0,1);
    ringEl.style.strokeDashoffset=String(RING_LEN*(1-prog));
    globeMat.emissiveIntensity=lerp(globeMat.emissiveIntensity,mode==='diving'?.9:prog*.45,.08);
    if(mode==='desk'&&prog>=1&&!dragging)startDive();

    // lamp breathing
    const flick=1+Math.sin(t*1.7)*.015+Math.sin(t*5.3)*.006;
    lampLevel=lerp(lampLevel,lampOn?1:0,1-Math.pow(.02,dt));
    lampLights.forEach(l=>l.intensity=l.userData.base*flick*lampLevel);
    M.glow.color.copy(GLOW_OFF).lerp(GLOW_ON,lampLevel);

    // dust drift
    if(DUST){const p=dustGeo.attributes.position.array;for(let i=0;i<DUST;i++){const s=dseed[i];p[i*3]+=Math.sin(t*.2+s)*.00012;p[i*3+1]+=Math.cos(t*.13+s*1.3)*.0001-.00004;if(p[i*3+1]<.75)p[i*3+1]=1.9;}dustGeo.attributes.position.needsUpdate=true;}

    if(!reduceMotion)restPos.add(new THREE.Vector3(pointerS.x*.05,pointerS.y*.025,0));

    else{
      // fly into the little globe
      const dur=reduceMotion?.6:2.4;
      diveT=clamp(diveT+(mode==='diving'?dt:-dt)/dur,0,1);
      const e=ease(diveT);
      const into=globeWorld.clone().add(restPos.clone().sub(globeWorld).normalize().multiplyScalar(.075));
      camera.position.copy(restPos).lerp(into,reduceMotion?0:e);
      const nn=lerp(.05,.004,smooth(.4,.85,e));if(Math.abs(camera.near-nn)>1e-4){camera.near=nn;camera.updateProjectionMatrix();}

  }

}

function buildRevealField(){
  RF_W=240;RF_H=Math.round(240*innerHeight/innerWidth)||135;
  revealField=new Float32Array(RF_W*RF_H);const N=makeNoise(5);
  for(let y=0;y<RF_H;y++)for(let x=0;x<RF_W;x++){
    const dx=(x/RF_W-.5)*innerWidth/innerHeight,dy=y/RF_H-.5;
    revealField[y*RF_W+x]=Math.hypot(dx,dy)*.9+N.fbm(x*.05,y*.05,4)*.55;
  }
  maskCanvas=mkCanvas(RF_W,RF_H);
}
function showMap(){
  mode='map';reveal=reduceMotion?1:0;
  sizeMap();view.s=1;view.x=0;view.y=0;buildRevealField();anim=null;
  // on a narrow phone screen, open closer in on Asia so the chapters are in reach
  if(innerWidth<700&&MAP){const c=regionCentre();setView([c[0]-MAP.canvas.width*.06,c[1]-MAP.canvas.height*.08],2.4,[innerWidth/2,innerHeight*.42]);clampView();}
  mapWrap.classList.add('show');mapWrap.setAttribute('aria-hidden','false');
  document.body.classList.add('on-map');
  if(usedKeyboard)document.getElementById('backBtn').focus({preventScroll:true});
}

/* markers */
function markerPositions(){
  const {s,ox,oy}=mapToScreen();
  return CHAPTERS.map(c=>{const p=MAP.proj(c.ll);return{x:ox+p[0]*s,y:oy+p[1]*s};});
}
function clustered(pos){return Math.hypot(pos[0].x-pos[1].x,pos[0].y-pos[1].y)<46;}
function drawMarker(x,y,label,sub,on,t,big){
  const r=on?11:8.5,pulse=reduceMotion?0:(t*.6)%1;
  const g=mg.createRadialGradient(x,y,0,x,y,r*2.4);g.addColorStop(0,'rgba(181,33,111,.45)');g.addColorStop(1,'rgba(181,33,111,0)');
  mg.fillStyle=g;mg.beginPath();mg.arc(x,y,r*2.4,0,7);mg.fill();
  if(!reduceMotion){mg.strokeStyle=`rgba(181,33,111,${.5*(1-pulse)})`;mg.lineWidth=1.2;mg.beginPath();mg.arc(x,y,r+pulse*16,0,7);mg.stroke();}
  mg.fillStyle='#b5216f';mg.beginPath();mg.arc(x,y,r*.55,0,7);mg.fill();
  mg.strokeStyle='#2c2a33';mg.lineWidth=1.1;mg.beginPath();mg.arc(x,y,r,0,7);mg.stroke();
  mg.font=`italic ${big?22:19}px "Instrument Serif", Georgia, serif`;mg.textBaseline='middle';
  // flip the label to the left when it would run off the screen
  const left=x+r+8+mg.measureText(label).width>innerWidth-12;mg.textAlign=left?'right':'left';const lx=left?x-r-8:x+r+8;
  mg.lineWidth=5;mg.strokeStyle='rgba(251,249,244,.9)';mg.strokeText(label,lx,y-(sub?7:0));
  mg.fillStyle='#2c2a33';mg.fillText(label,lx,y-(sub?7:0));
  if(sub){mg.font='12px Manrope, system-ui, sans-serif';mg.strokeText(sub,lx+(left?-1:1),y+11);mg.fillStyle='#6f6a74';mg.fillText(sub,lx+(left?-1:1),y+11);}
}
function drawMarkers(t){
  const pos=markerPositions();
  if(clustered(pos)){const x=(pos[0].x+pos[1].x)/2,y=(pos[0].y+pos[1].y)/2;drawMarker(x,y,'Malaysia & Singapore','2 chapters',false,t,false);return;}
  pos.forEach((p,i)=>drawMarker(p.x,p.y,CHAPTERS[i].short,'Chapter '+CHAPTERS[i].n,i===active,t,i===active));
}
function hitMarker(cx,cy){
  const pos=markerPositions();
  if(clustered(pos)){const x=(pos[0].x+pos[1].x)/2,y=(pos[0].y+pos[1].y)/2;return Math.hypot(cx-x,cy-y)<30||(cx>x&&cx<x+190&&Math.abs(cy-y)<20)?'cluster':null;}
  for(let i=0;i<pos.length;i++){const p=pos[i];if(Math.hypot(cx-p.x,cy-p.y)<26||(cx>p.x&&cx<p.x+150&&Math.abs(cy-p.y)<18))return i;}
  return null;
}
function regionCentre(){const a=MAP.proj(CHAPTERS[0].ll),b=MAP.proj(CHAPTERS[1].ll);return[(a[0]+b[0])/2,(a[1]+b[1])/2];}

/* chapter panel */
function openChapter(i){
  active=i;const c=CHAPTERS[i];
  document.getElementById('chNum').textContent='Chapter '+c.n;
  document.getElementById('chPlace').textContent=c.place;
  document.getElementById('chTitle').textContent=c.title;
  const body=document.getElementById('chBody');body.innerHTML='';
  c.body.forEach(t=>{const p=document.createElement('p');p.textContent=t;body.appendChild(p);});
  const q=document.createElement('blockquote');q.textContent=c.quote;body.appendChild(q);
  document.getElementById('chPrev').disabled=i===0;document.getElementById('chNext').disabled=i===CHAPTERS.length-1;
  document.getElementById('chNext').querySelector('span').textContent=i<CHAPTERS.length-1?CHAPTERS[i+1].short:'';
  document.getElementById('chPrev').querySelector('span').textContent=i>0?CHAPTERS[i-1].short:'';
  chPanel.classList.add('open');document.body.classList.add('ch-open');chPanel.setAttribute('aria-hidden','false');chPanel.scrollTop=0;
  chList.querySelectorAll('button[data-ch]').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.ch===i)));
  placeEl.classList.remove('on');
  flyTo(MAP.proj(c.ll),11.5,anchor());
  if(usedKeyboard)chPanel.querySelector('.chClose').focus({preventScroll:true});
}
function closeChapter(){
  if(active<0)return;active=-1;chPanel.classList.remove('open');document.body.classList.remove('ch-open');chPanel.setAttribute('aria-hidden','true');
  chList.querySelectorAll('button[data-ch]').forEach(b=>b.setAttribute('aria-current','false'));
  flyTo(regionCentre(),9.5,[innerWidth/2,innerHeight/2]);
}
chList.querySelectorAll('button[data-ch]').forEach(b=>b.addEventListener('click',()=>openChapter(+b.dataset.ch)));
document.getElementById('chPrev').addEventListener('click',()=>{if(active>0)openChapter(active-1);});
document.getElementById('chNext').addEventListener('click',()=>{if(active<CHAPTERS.length-1)openChapter(active+1);});
chPanel.querySelector('.chClose').addEventListener('click',closeChapter);
worldBtn.addEventListener('click',()=>{if(active>=0){active=-1;chPanel.classList.remove('open');document.body.classList.remove('ch-open');chPanel.setAttribute('aria-hidden','true');}flyTo([MAP.canvas.width/2,MAP.canvas.height/2],1,[innerWidth/2,innerHeight/2]);});

// draw only the part of a big image that is on screen (keeps deep zoom fast)
function drawClipped(img,dx,dy,dw,dh,alpha=1){
  const W=innerWidth,H=innerHeight,kx=img.width/dw,ky=img.height/dh;
  const x0=Math.max(0,dx),y0=Math.max(0,dy),x1=Math.min(W,dx+dw),y1=Math.min(H,dy+dh);
  if(x1<=x0||y1<=y0)return;
  const sx=(x0-dx)*kx,sy=(y0-dy)*ky,sw=(x1-x0)*kx,sh=(y1-y0)*ky;
  mg.globalAlpha=alpha;mg.drawImage(img,sx,sy,sw,sh,x0,y0,x1-x0,y1-y0);mg.globalAlpha=1;
}
function drawMap(t){
  const w=innerWidth,h=innerHeight;
  mg.fillStyle='#fbf9f4';mg.fillRect(0,0,w,h);
  if(!MAP)return;
  if(anim){
    anim.t=Math.min(1,anim.t+1/60/anim.dur);const e=ease(anim.t);
    // ease out wide, then in: a gentle dip in zoom on long flights
    const far=Math.hypot(anim.P1[0]-anim.P0[0],anim.P1[1]-anim.P0[1])*view.fit*Math.min(anim.s0,anim.s1);
    const dip=Math.min(.6,far/1400)*Math.sin(e*Math.PI);
    const ls=lerp(Math.log(anim.s0),Math.log(anim.s1),e)-dip*Math.log(Math.max(anim.s0,anim.s1));
    setView([lerp(anim.P0[0],anim.P1[0],e),lerp(anim.P0[1],anim.P1[1],e)],clamp(Math.exp(ls),1,MAX_ZOOM),anim.A);
    if(anim.t>=1)anim=null;
  }
  const {s,ox,oy}=mapToScreen();
  if(reveal<1){
    reveal=Math.min(1,reveal+1/150);
    const th=ease(reveal)*1.9;
    const mc=maskCanvas.getContext('2d'),id=mc.createImageData(RF_W,RF_H),d=id.data;
    for(let i=0;i<revealField.length;i++){const v=clamp((th-revealField[i])*6,0,1);d[i*4+3]=v*255;}
    mc.putImageData(id,0,0);
    mg.save();mg.drawImage(MAP.canvas,ox,oy,MAP.canvas.width*s,MAP.canvas.height*s);
    mg.globalCompositeOperation='destination-in';mg.imageSmoothingEnabled=true;mg.drawImage(maskCanvas,0,0,w,h);
    mg.globalCompositeOperation='destination-over';mg.fillStyle='#fbf9f4';mg.fillRect(0,0,w,h);mg.restore();
    return;
  }
  drawClipped(MAP.canvas,ox,oy,MAP.canvas.width*s,MAP.canvas.height*s);
  if(REG&&REG_PAINTED){
    const a=smooth(2.2,4.4,view.s);
    if(a>0){const r=REG.rect;drawClipped(REG.canvas,ox+r[0]*s,oy+r[1]*s,r[2]*s,r[3]*s,a);}
  }
  drawMarkers(t);
  worldBtn.classList.toggle('show',view.s>1.6);
}

/* pan / zoom / hover / tap */
const ptrs=new Map();let pinch=null,panLast=null,moved=0;
mapCanvas.addEventListener('pointerdown',e=>{anim=null;mapCanvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptrs.size===1){panLast={x:e.clientX,y:e.clientY};mapCanvas.classList.add('dragging');}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s};}
});
mapCanvas.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.s*d/pinch.d/view.s);return;}
  if(ptrs.size===1&&panLast){const dx=e.clientX-panLast.x,dy=e.clientY-panLast.y;moved+=Math.abs(dx)+Math.abs(dy);view.x+=dx;view.y+=dy;clampView();panLast={x:e.clientX,y:e.clientY};}
  if(e.pointerType==='mouse'&&ptrs.size===0){mapCanvas.style.cursor=MAP&&hitMarker(e.clientX,e.clientY)!==null?'pointer':'';hover(e.clientX,e.clientY);}
});
const upMap=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(ptrs.size===0){panLast=null;mapCanvas.classList.remove('dragging');
    if(moved<6&&MAP){const hit=hitMarker(e.clientX,e.clientY);
      if(hit==='cluster')flyTo(regionCentre(),9.5,[innerWidth/2,innerHeight/2]);
      else if(hit!==null)openChapter(hit);
      else hover(e.clientX,e.clientY,true);}}};
mapCanvas.addEventListener('pointerup',upMap);mapCanvas.addEventListener('pointercancel',upMap);
mapCanvas.addEventListener('pointerleave',()=>{if(!ptrs.size)placeEl.classList.remove('on');});
mapCanvas.addEventListener('wheel',e=>{e.preventDefault();anim=null;zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015));},{passive:false});
function zoomAt(cx,cy,f){
  const ns=clamp(view.s*f,1,MAX_ZOOM),k=ns/view.s;
  const px=cx-innerWidth/2,py=cy-innerHeight/2;
  view.x=px-(px-view.x)*k;view.y=py-(py-view.y)*k;view.s=ns;clampView();
}
function hover(cx,cy,tap){
  if(!MAP)return;
  const ll=MAP.proj.invert(worldAt(cx,cy));
  let name='';
  if(ll&&isFinite(ll[0])){
    const set=view.s>3?COUNTRIES50:COUNTRIES110;
    if(set)for(const f of set){if(d3.geoContains(f,ll)){name=f.properties.name;break;}}
  }
  if(name){placeEl.textContent=name;placeEl.style.left=cx+'px';placeEl.style.top=cy+'px';placeEl.classList.add('on');}
  else placeEl.classList.remove('on');
}
addEventListener('keydown',e=>{if(mode==='map'&&e.key==='Escape'){if(active>=0)closeChapter();else rise();}});

/* the finer painting of the peninsula, laid exactly over the world sheet */
async function paintRegion(){
  const wp=MAP.proj,bb=[[89,15],[121,-9]];
  const c=[wp([bb[0][0],bb[0][1]]),wp([bb[0][0],bb[1][1]]),wp([bb[1][0],bb[0][1]]),wp([bb[1][0],bb[1][1]])];
  const x0=Math.min(...c.map(p=>p[0])),x1=Math.max(...c.map(p=>p[0])),y0=Math.min(...c.map(p=>p[1])),y1=Math.max(...c.map(p=>p[1]));
  const RW=2400,k=RW/(x1-x0),RH=Math.round((y1-y0)*k);
  const t=wp.translate(),proj=d3.geoNaturalEarth1().scale(wp.scale()*k).translate([(t[0]-x0)*k,(t[1]-y0)*k]);
  const labels=[['Malaysia',102.6,4.6,'#5f3d82',150],['Thailand',100.4,8.6,'#5f3d82',100],['Sumatra',101.0,-.9,'#9a6a1f',110],
    ['Borneo',110.4,1.2,'#5f3d82',100],['Strait of Malacca',99.2,3.9,'#557a99',78,-.72],['South China Sea',107.4,6.0,'#557a99',90],['Java Sea',108.2,-2.9,'#557a99',72]];
  const r=await paintWatercolourMap(RW,RH,{proj,alphaEdge:true,grat:[5,5],labels});
  REG={canvas:r.canvas,rect:[x0,y0,x1-x0,y1-y0]};
}


/* ── Quality ramp ────────────────────────────────────────────────────────
   The first frame has to be cheap on ANY machine: a visitor on an old
   laptop or a phone should see the desk quickly, not wait for a software
   rasteriser to grind through a reflected scene and a bloom chain.

   So the scene starts plain — no pond reflection, no bloom — and both are
   switched on once the page has settled, after the map is painted and the
   visitor has had a moment with the room. */
let qualityOn=false;
function enableQuality(){
  if(qualityOn)return;
  qualityOn=true;
  pond.visible=true;
  bloom.enabled=true;
}

/* ---------- boot ---------- */
(async function boot(){
  try{
    await new Promise(r=>requestAnimationFrame(()=>r()));
    /* Deliberately NOT calling renderer.compile(scene,camera). It blocks for
       ~2.9s compiling every material's shader program, and the scene is
       hidden behind the loading screen anyway — the first frame compiles
       them as it draws, and nothing is visible until then. */
    requestAnimationFrame(frame);
    /* The desk is on screen before the map is painted — the map is what you
       unlock by spinning the globe. But the loading screen must not lift
       until the desk has actually been drawn, or the visitor stares at an
       empty white page while the shaders compile. */
    await new Promise(function(resolve){
      function waitFirst(){
        if(window.__deskVisible){ resolve(); return; }
        requestAnimationFrame(waitFirst);
      }
      waitFirst();
    });
    document.getElementById('loading').classList.add('done');
    deskCanvas.focus({preventScroll:true});

    /* The map is painted after the desk is on screen. Nothing on the desk
       needs it, and the visitor is looking at a room, not a blank page. */
    const big=innerWidth*Math.min(devicePixelRatio||1,2)>2200;
    await landReady;
    MAP=await paintWatercolourMap(big?2100:1800,big?1090:935);
    sizeMap();
    /* The finer peninsula painting only matters once you zoom past 2.2x, so
       it is painted after the atlas is visible rather than before it. */
    paintRegion().then(function(){REG_PAINTED=true;}).catch(function(){});
    /* Once the atlas is painted and the desk is on screen, switch on the
       expensive extras. The visitor has already seen the room. */
    setTimeout(enableQuality,900);
  }catch(err){
    console.error(err);
    document.querySelector('#loading p').className='fail';
    document.querySelector('#loading p').textContent='The scene could not start. This page needs WebGL, so try a recent version of Safari, Chrome or Firefox.';
  }
})();

</script>
